name: Apply complete direct source fixes

on:
  push:
    branches:
      - fix/full-direct-metric-and-3d2d

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source files directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 exact match, got {n}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # 1) Evaluation: fix "assigned to a track that ever confirmed".
          # ------------------------------------------------------------------
          path = Path('evaluate_joint_tracking_metrics.m')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          text = replace_once(text,
              "metrics.evaluation_version = 2;",
              "metrics.evaluation_version = 3;",
              'evaluation version')
          text = replace_once(text,
              "metrics.status = 'ok';\nmetrics.truth_targets = truth_labels.summary;",
              "metrics.status = 'ok';\nmetrics.confirmed_track_ids = confirmed_ids;\nmetrics.truth_targets = truth_labels.summary;",
              'confirmed id diagnostics')

          old_assoc = """function m = association_metrics(n_meas, assigned_ids, confirmed_ids)
n_assigned = numel(assigned_ids);
n_confirmed = nnz(ismember(assigned_ids, confirmed_ids));
m = struct('basis', 'measurement_dimension', ...
    'n_measurements', n_meas, ...
    'n_assigned', n_assigned, ...
    'n_assigned_confirmed', n_confirmed, ...
    'rate_all_tracks', safe_ratio(n_assigned, n_meas), ...
    'rate_confirmed_tracks', safe_ratio(n_confirmed, n_meas), ...
    'n_mode_assigned', 0);
end"""
          new_assoc = """function m = association_metrics(n_meas, assigned_ids, confirmed_ids)
% "曾确认"口径：量测只要被分配给一条在完整生命周期中曾进入 confirmed
% 状态的逻辑航迹，就计入分子；不要求该量测发生时航迹已经确认。
assigned_ids = reshape(assigned_ids, 1, []);
confirmed_ids = unique(reshape(confirmed_ids, 1, []));
valid_assigned = isfinite(assigned_ids);
n_assigned = nnz(valid_assigned);
n_confirmed = nnz(valid_assigned & ismember(assigned_ids, confirmed_ids));
m = struct('basis', 'measurement_dimension_assigned_to_ever_confirmed_logical_track', ...
    'n_measurements', n_meas, ...
    'n_assigned', n_assigned, ...
    'n_assigned_confirmed', n_confirmed, ...
    'n_unique_confirmed_track_ids', numel(confirmed_ids), ...
    'rate_all_tracks', safe_ratio(n_assigned, n_meas), ...
    'rate_confirmed_tracks', safe_ratio(n_confirmed, n_meas), ...
    'n_mode_assigned', 0);
end"""
          text = replace_once(text, old_assoc, new_assoc, 'association_metrics')

          start = "function ids = collect_confirmed_ids(est, fallback_output_ids)"
          end = "function n = get_transition_count(est)"
          i = text.find(start)
          j = text.find(end)
          if i < 0 or j < 0 or j <= i or text.find(start, i + 1) >= 0:
              raise RuntimeError('collect_confirmed_ids boundary not unique')
          new_collect = """function ids = collect_confirmed_ids(est, fallback_output_ids)
% CONFIRMED_ASSOCIATION_DIRECT_FIX_V3
% 收集逻辑航迹在完整生命周期内的“曾确认”ID。任何单一日志源都不能作为
% 排他来源：成熟3D主干可能直接形成正式输出，而维度管理器 transition_log
% 未必记录该3D ID的首次确认。因此必须对所有可靠确认依据取并集。

% 正式输出一定来自确认航迹，是最直接的确认依据。
ids = reshape(fallback_output_ids, 1, []);

% 显式 logical_confirm_* 事件补充确认后处于 hold、尚未正式输出等情况。
if isstruct(est) && isfield(est, 'transition_log') && ~isempty(est.transition_log)
    log = est.transition_log;
    if isstruct(log) && isfield(log, 'id') && isfield(log, 'reason')
        reasons = {log.reason};
        is_confirm = false(size(reasons));
        for q = 1:numel(reasons)
            reason = reasons{q};
            is_confirm(q) = ischar(reason) && strncmp(reason, 'logical_confirm_', 16);
        end
        if any(is_confirm)
            ids = [ids, reshape([log(is_confirm).id], 1, [])]; %#ok<AGROW>
        end
    end
end

% full/diagnostic history 中的 confirmed snapshots。
if isstruct(est) && isfield(est, 'logical_tracks') && ~isempty(est.logical_tracks)
    for k = 1:numel(est.logical_tracks)
        tracks = est.logical_tracks{k};
        if isempty(tracks) || ~isstruct(tracks) || ...
                ~isfield(tracks, 'id') || ~isfield(tracks, 'confirmed')
            continue;
        end
        confirmed = logical([tracks.confirmed]);
        if any(confirmed)
            ids = [ids, reshape([tracks(confirmed).id], 1, [])]; %#ok<AGROW>
        end
    end
end

% L/L2 均是正式输出标签，再作为兼容性确认依据。兼容 Nx2 与 2xN 布局。
for name_cell = {'L', 'L2'}
    name = name_cell{1};
    if ~isstruct(est) || ~isfield(est, name) || isempty(est.(name)), continue; end
    cells = est.(name);
    for k = 1:numel(cells)
        L = cells{k};
        if isempty(L), continue; end
        if size(L, 2) == 2
            values = reshape(L(:, 2), 1, []);
        elseif size(L, 1) == 2
            values = reshape(L(2, :), 1, []);
        else
            continue;
        end
        ids = [ids, values]; %#ok<AGROW>
    end
end

ids = unique(ids(isfinite(ids)));
end

"""
          text = text[:i] + new_collect + text[j:]
          text = replace_once(text,
              "fprintf('  量测关联率(全部/曾确认): %.2f%% / %.2f%%  (%d/%d, %d/%d)\\n', ...",
              "fprintf('  量测关联率(全部/分配至曾确认航迹): %.2f%% / %.2f%%  (%d/%d, %d/%d)\\n', ...",
              'metric report label')
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 2) 3D->2D source: complete confirmation log and verify new control.
          # ------------------------------------------------------------------
          path = Path('run_filter_joint_2d3d.m')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          required = [
              "p.active3d_missing_down_s = get_cfg(cfg, 'joint_active3d_missing_down_s', 0.30);",
              "q.down3d = q.down_by_range_uncertainty || q.down_by_active3d_missing;",
              "version = 8;",
          ]
          for marker in required:
              if marker not in text:
                  raise RuntimeError(f'run_filter_joint_2d3d missing marker: {marker}')

          creation_anchor = """        companions(end + 1, 1) = c; %#ok<AGROW>
        i = numel(companions);
        known(q) = true;
        companion_index(q) = i;"""
          creation_repl = """        companions(end + 1, 1) = c; %#ok<AGROW>
        i = numel(companions);
        known(q) = true;
        companion_index(q) = i;
        % Mature external 3-D tracks can first appear already confirmed.
        % Record that lifecycle fact explicitly so evaluation/log consumers
        % have a complete logical-confirmation ledger.
        if c.confirmed
            changes(end + 1) = make_transition(c, t, ...
                'tentative', '3d', 'logical_confirm_3d_external'); %#ok<AGROW>
        end"""
          if 'logical_confirm_3d_external' not in text:
              text = replace_once(text, creation_anchor, creation_repl,
                                  'external confirmed creation log')
          text = text.replace("reason = 'external_3d_confirmed';",
                              "reason = 'logical_confirm_3d_external';")
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 3) Config: make the two direct degradation indicators explicit.
          # ------------------------------------------------------------------
          path = Path('config_fusion.m')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          pattern = re.compile(
              r"cfg\.joint_pos95_warn_m = 15000;[^\n]*\n"
              r"cfg\.joint_pos95_down_m = 30000;[^\n]*\n"
              r"cfg\.joint_pos95_recover_m = 10000;[^\n]*\n"
              r"cfg\.joint_radial95_warn_m = 10000;[^\n]*\n"
              r"cfg\.joint_radial95_down_m = 20000;[^\n]*\n"
              r"cfg\.joint_radial95_recover_m = 7000;[^\n]*\n"
              r"cfg\.joint_relative_range_down = 0\.60;[^\n]*\n\n"
              r"cfg\.joint_space_nis_window = 5;[^\n]*\n"
              r"cfg\.joint_space_nis_recover = 1\.5;[^\n]*\n"
              r"cfg\.joint_space_nis_warn = 2\.5;[^\n]*\n"
              r"cfg\.joint_space_nis_down = 4\.0;[^\n]*")
          new_block = """% 3D->2D直接控制指标：
%   1) LOS径向距离95%不确定度；
%   2) 距最近一次“带距离主动三维更新”的缺失时间。
% 两者任一达到 down 门，连续 joint_down_consecutive 次后进入降维提交判断。
cfg.joint_radial95_warn_m = 10000;       % 距离95%不确定度预警门[m]
cfg.joint_radial95_down_m = 20000;       % 距离95%不确定度降级门[m]
cfg.joint_radial95_recover_m = 7000;     % 距离95%不确定度恢复门[m]
cfg.joint_active3d_missing_warn_s = 0.20;    % 主动三维距离量测缺失预警[s]
cfg.joint_active3d_missing_down_s = 0.30;    % 主动三维距离量测缺失降级[s]
cfg.joint_active3d_missing_recover_s = 0.15; % 主动三维距离量测恢复新鲜度[s]

% 以下指标继续计算，供诊断/绘图使用，但不直接触发3D->2D。
cfg.joint_pos95_warn_m = 15000;          % 位置95%不确定度诊断预警门[m]
cfg.joint_pos95_down_m = 30000;          % 位置95%不确定度诊断门[m]
cfg.joint_pos95_recover_m = 10000;       % 位置95%不确定度诊断恢复门[m]
cfg.joint_relative_range_down = 0.60;    % 相对距离不确定度诊断门
cfg.joint_space_nis_window = 5;          % 空间NIS诊断滑窗长度
cfg.joint_space_nis_recover = 1.5;       % 空间NIS诊断恢复门
cfg.joint_space_nis_warn = 2.5;          % 空间NIS诊断预警门
cfg.joint_space_nis_down = 4.0;          % 空间NIS诊断门"""
          text, n = pattern.subn(new_block, text, count=1)
          if n != 1:
              raise RuntimeError(f'config 3D->2D block: expected 1 match, got {n}')
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 4) Validation: defaults + scalar/order checks for new thresholds.
          # ------------------------------------------------------------------
          path = Path('validate_config_fusion.m')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          if "set_default(cfg, 'joint_active3d_missing_down_s'" not in text:
              text = replace_once(text,
                  "cfg = set_default(cfg, 'joint_radial95_recover_m', 7000);",
                  "cfg = set_default(cfg, 'joint_radial95_recover_m', 7000);\n"
                  "cfg = set_default(cfg, 'joint_active3d_missing_warn_s', 0.20);\n"
                  "cfg = set_default(cfg, 'joint_active3d_missing_down_s', 0.30);\n"
                  "cfg = set_default(cfg, 'joint_active3d_missing_recover_s', 0.15);",
                  'validation defaults')
          if "must_be_positive(cfg.joint_active3d_missing_down_s" not in text:
              text = replace_once(text,
                  "must_be_positive(cfg.joint_radial95_down_m, 'cfg.joint_radial95_down_m');",
                  "must_be_positive(cfg.joint_radial95_down_m, 'cfg.joint_radial95_down_m');\n"
                  "must_be_nonnegative(cfg.joint_active3d_missing_recover_s, 'cfg.joint_active3d_missing_recover_s');\n"
                  "must_be_positive(cfg.joint_active3d_missing_warn_s, 'cfg.joint_active3d_missing_warn_s');\n"
                  "must_be_positive(cfg.joint_active3d_missing_down_s, 'cfg.joint_active3d_missing_down_s');",
                  'validation scalar checks')
          if "主动三维量测缺失时间门限要求" not in text:
              old = """if ~(cfg.joint_radial95_recover_m < cfg.joint_radial95_warn_m && ...
        cfg.joint_radial95_warn_m < cfg.joint_radial95_down_m)
    error('径向误差门限要求 recover < warn < down');
end"""
              new = """if ~(cfg.joint_radial95_recover_m < cfg.joint_radial95_warn_m && ...
        cfg.joint_radial95_warn_m < cfg.joint_radial95_down_m)
    error('距离95%不确定度门限要求 recover < warn < down');
end
if ~(cfg.joint_active3d_missing_recover_s < cfg.joint_active3d_missing_warn_s && ...
        cfg.joint_active3d_missing_warn_s < cfg.joint_active3d_missing_down_s)
    error('主动三维量测缺失时间门限要求 recover < warn < down');
end"""
              text = replace_once(text, old, new, 'validation threshold order')
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 5) Launcher: no source hot-patching. Everything above is direct.
          # ------------------------------------------------------------------
          Path('run_fusion_main_fixed.m').write_text("""% run_fusion_main_fixed.m
% Compatibility launcher. All fixes are already implemented directly in
% the source files; no runtime source patching is performed.
root = fileparts(mfilename('fullpath'));
clear evaluate_joint_tracking_metrics run_filter_joint_2d3d config_fusion validate_config_fusion;
rehash;
run(fullfile(root, 'run_fusion_main.m'));
""", encoding='utf-8')

          # Remove obsolete hotfix/package artifacts from earlier attempts.
          for stale in [
              Path('apply_confirmed_association_fix.m'),
              Path('ASSOCIATION_METRIC_FIX.md'),
              Path('test_joint_confirmed_association_fix.m'),
          ]:
              if stale.exists():
                  stale.unlink()
          legacy = Path('+metriclegacy')
          if legacy.exists():
              for item in sorted(legacy.rglob('*'), reverse=True):
                  if item.is_file() or item.is_symlink(): item.unlink()
                  elif item.is_dir(): item.rmdir()
              legacy.rmdir()

          # Static invariants that must be true in the final source tree.
          eval_text = Path('evaluate_joint_tracking_metrics.m').read_text(encoding='utf-8')
          filter_text = Path('run_filter_joint_2d3d.m').read_text(encoding='utf-8')
          cfg_text = Path('config_fusion.m').read_text(encoding='utf-8')
          val_text = Path('validate_config_fusion.m').read_text(encoding='utf-8')
          checks = {
              'metric union fix': 'CONFIRMED_ASSOCIATION_DIRECT_FIX_V3' in eval_text,
              'metric finite assignment count': 'valid_assigned & ismember' in eval_text,
              '3d2d range criterion': 'down_by_range_uncertainty' in filter_text,
              '3d2d missing criterion': 'down_by_active3d_missing' in filter_text,
              'old position criterion removed from down3d': 'q.down3d = q.position95_m' not in filter_text,
              'explicit config missing threshold': 'joint_active3d_missing_down_s = 0.30' in cfg_text,
              'validation missing threshold': "set_default(cfg, 'joint_active3d_missing_down_s', 0.30)" in val_text,
              'external 3d confirm ledger': 'logical_confirm_3d_external' in filter_text,
          }
          failed = [k for k, ok in checks.items() if not ok]
          if failed:
              raise RuntimeError('static source verification failed: ' + ', '.join(failed))
          print('All direct-source invariants verified.')
          PY

      - name: Commit final direct-source version
        shell: bash
        run: |
          rm -f .github/workflows/apply-complete-source-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Complete direct metric and 3D-to-2D source fixes [skip ci]"
          git push origin HEAD:fix/full-direct-metric-and-3d2d
